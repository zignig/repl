[package]
name = "repl"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
blake3 = { version = "1.8.7", features = ["serde"] }
clap = "4.6.6"
clap_derive = "4.6.4"
directories = "6.0.0"
iroh = "1.1.0"
iroh-blobs = "0.103.0"
iroh-gossip = "0.101.0"
iroh-smol-kv = "0.4.0"
n0-future = "0.3.2"
n0-snafu = "0.2.3"
redb = "4.2.0"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1", features = ["full"] }
toml = "1.1.4"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
